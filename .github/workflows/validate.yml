name: validate (public)
# This workflow covers the gates a checkout of this repository can
# satisfy. This repository carries no test suite and no coverage gate,
# so the workflow runs neither.
#
# Every job carries a repository guard, so the workflow stays inert in a
# fork. The guard keeps the file under version control beside the source
# it validates.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'NT-NinjaTrader/mcp-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv pip install --system matplotlib
      - run: ./scripts/validate-all.sh
      - name: skill line-count warning
        run: |
          over=$(wc -l skills/*/SKILL.md | awk '$1 > 500 && $2 != "total" {print $2" ("$1" lines)"}')
          if [ -n "$over" ]; then
            echo "::warning::SKILL.md over 500 lines: $over"
          fi
  skills-ref:
    # `skills-ref` is an unvetted third-party npm package. One individual
    # maintains it, its `repository` field is empty, and its dependencies
    # use caret ranges that resolve at run time. A fork pull request must
    # never trigger that code on this repo's runner, so this job runs only
    # for a push or for a pull request from a branch in this repo.
    if: >-
      github.repository == 'NT-NinjaTrader/mcp-skills' &&
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The default shell is `bash -e`, so a bare loop stops at the first
      # failing skill and hides the rest. Collect every failure instead.
      - name: validate every skill reference
        run: |
          fail=0
          for d in skills/*/; do
            npx -y skills-ref@0.1.5 validate "$d" || fail=1
          done
          exit $fail
  manifest-lint:
    if: github.repository == 'NT-NinjaTrader/mcp-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/manifest-lint.sh
  ste-lint:
    if: github.repository == 'NT-NinjaTrader/mcp-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # `-r` stops xargs from running the linter with no argument when the
      # match set is empty. `-0` keeps a path with a space intact.
      - name: ste-lint every markdown file
        run: git ls-files -z '*.md' | xargs -0 -r python3 scripts/ste-lint.py
      # Every prose paragraph sits on one source line. This gate covers every
      # markdown file, including README.md, which ste-lint.py skips because a
      # README follows the ordinary technical-writing rules instead.
      #
      # The prompt files under skills/trade-debrief/references/prompts/ are
      # exempt. Each one is a verbatim prompt for another model, and the
      # skill sends the text as-is, so its line breaks are part of the
      # artifact. ste-lint.py skips the same paths.
      - name: reflow-lint every markdown file
        run: |
          git ls-files -z '*.md' \
            | grep -zv '^skills/trade-debrief/references/prompts/' \
            | xargs -0 -r python3 scripts/readme-reflow-lint.py
  zizmor:
    if: github.repository == 'NT-NinjaTrader/mcp-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx zizmor .github/workflows/
  shellcheck:
    if: github.repository == 'NT-NinjaTrader/mcp-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh
  python-quality:
    if: github.repository == 'NT-NinjaTrader/mcp-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx ruff check .
      - run: uvx ruff format --check .
